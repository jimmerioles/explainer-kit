<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="/kit/render/" />
    <title>explainer renderer</title>
    <link rel="stylesheet" href="../fonts/local.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #03050c;
        overflow: hidden;
        height: 100%;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 56.25vw;
        max-height: 100vh;
        max-width: 177.78vh;
        margin: auto;
        position: absolute;
        inset: 0;
        background: #070a15;
      }
    </style>
  </head>
  <body>
    <canvas id="stage" width="1920" height="1080"></canvas>
    <script type="module" src="./main.js"></script>
  </body>
</html>
